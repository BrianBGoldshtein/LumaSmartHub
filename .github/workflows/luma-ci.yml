name: Luma software checks

on:
  push:
    paths:
      - "SD Card/source/**"
      - "SD Card/image-builder/**"
      - "SD Card/docs/**"
      - "SD Card/README.md"
      - "SD Card/CURRENT_STATUS.md"
      - "SD Card/PROGRESS.md"
      - ".github/workflows/luma-ci.yml"
  pull_request:
    paths:
      - "SD Card/source/**"
      - "SD Card/image-builder/**"
      - "SD Card/docs/**"
      - "SD Card/README.md"
      - "SD Card/CURRENT_STATUS.md"
      - "SD Card/PROGRESS.md"
      - ".github/workflows/luma-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luma-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "SD Card/source/backend/pyproject.toml"

      - name: Install backend native test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential device-tree-compiler libportaudio2 python3-dev python3-venv unzip

      - name: Prepare checksum-pinned public appliance assets
        run: bash "SD Card/image-builder/prepare-assets.sh"

      - name: Install backend and test dependencies
        working-directory: SD Card/source/backend
        run: python -m pip install -e ".[test,voice]"

      - name: Run complete backend suite (including Linux-only integration tests)
        working-directory: SD Card/source/backend
        run: python -m pytest -q

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: "SD Card/source/frontend/pnpm-lock.yaml"

      - name: Install frontend dependencies
        working-directory: SD Card/source/frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit tests
        working-directory: SD Card/source/frontend
        run: pnpm test

      - name: Type-check and build production UI
        working-directory: SD Card/source/frontend
        run: pnpm build

      - name: Check complete image-builder, recovery and packaging suite
        run: python -m pytest -q "SD Card/image-builder"
