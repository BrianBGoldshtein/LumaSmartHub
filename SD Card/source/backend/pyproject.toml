[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "luma-smart-screen"
version = "0.2.10"
description = "Local control plane for the Luma wall-mounted smart screen"
requires-python = ">=3.11"
dependencies = [
  "dbus-next>=0.2.3,<0.3",
  "cryptography>=44,<51",
  "evdev>=1.7,<2; sys_platform == 'linux'",
  "fastapi>=0.115,<1",
  "google-api-python-client>=2.150,<3",
  "google-auth-oauthlib>=1.2,<2",
  "httpx>=0.27,<1",
  "pyvesync==3.4.2",
  "tzdata>=2025.2",
  "uvicorn>=0.32,<1",
  "websockets>=15,<17",
]

[project.optional-dependencies]
voice = ["vosk>=0.3.45,<0.4", "spidev>=3.6,<4; sys_platform == 'linux'"]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
luma-api = "luma.api:main"
luma-device = "luma.device_agent:main"
luma-maintenance = "luma.maintenance:main"
luma-voice = "luma.voice_agent:main"
luma-network = "luma.network:main"
luma-backup = "luma.backup_broker:main"
luma-shortcut-gateway = "luma.shortcut_gateway:main"
luma-tailscale-setup = "luma.tailscale_setup:main"
luma-pi-connect-setup = "luma.pi_connect_setup:main"
luma-update = "luma.update_agent:main"
luma-update-broker = "luma.update_broker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/luma"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["luma"]
