# iPhone presence/ANCS uses BlueZ directly. Never advertise audio endpoints:
# calls, media and Siri audio must remain on the phone or its chosen headset.
# Keep ALSA/HDMI/ReSpeaker and local speech output fully enabled.
wireplumber.profiles = {
  main = {
    monitor.bluez = disabled
    monitor.bluez-midi = disabled
  }
  bluetooth = {
    monitor.bluez = disabled
    monitor.bluez-midi = disabled
  }
}
